name: SIPP validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sipp_audit
          POSTGRES_PASSWORD: isolated_ci_test
          POSTGRES_DB: sipp_audit_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U sipp_audit -d sipp_audit_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://sipp_audit:isolated_ci_test@127.0.0.1:5432/sipp_audit_test
      TEST_DATABASE_URL: postgresql://sipp_audit:isolated_ci_test@127.0.0.1:5432/sipp_audit_test
      TEST_REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10
          package_json_file: backend/package.json
      - run: pnpm --dir backend install --frozen-lockfile
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir backend exec prisma generate
      - run: pnpm --dir backend exec prisma migrate deploy
      - run: pnpm --dir backend test
      - run: pnpm --dir backend build
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend exec eslint src
      - run: pnpm --dir frontend build
      - run: python3 -m py_compile ops/operations.py
